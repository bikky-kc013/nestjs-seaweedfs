version: '3.8'

services:
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    command: master -volumeSizeLimitMB=1024 -volumeMax=10
    ports:
      - "9333:9333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -max=10 -fileSizeLimitMB=1024
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/status"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    command: filer -master=seaweedfs-master:9333 -s3 -s3.port=8333 -s3.allowEmptyFolder=true
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    ports:
      - "8888:8888"
      - "8333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8888/"]
      interval: 5s
      timeout: 3s
      retries: 10
