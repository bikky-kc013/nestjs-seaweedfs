<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#7fd8e0"/>
      <stop offset="55%" stop-color="#2fb4c9"/>
      <stop offset="100%" stop-color="#0e7fa3"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ecf8e"/>
      <stop offset="100%" stop-color="#1f8f63"/>
    </linearGradient>
    <linearGradient id="hairGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2fae76"/>
      <stop offset="100%" stop-color="#146a4a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe3d1"/>
      <stop offset="100%" stop-color="#ffd3ba"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e6303a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#095e78" stroke-width="6" opacity="0.5"/>

  <!-- Water ripples -->
  <path d="M0 400 Q 60 380 120 400 T 240 400 T 360 400 T 512 400 V512 H0 Z" fill="#0b6f8f" opacity="0.5"/>
  <path d="M0 430 Q 60 412 120 430 T 240 430 T 360 430 T 512 430 V512 H0 Z" fill="#095e78" opacity="0.6"/>

  <!-- Floating seaweed strands (background, behind character) -->
  <g opacity="0.55">
    <path d="M70 470 C 60 420 90 400 70 350 C 50 300 85 280 65 230" stroke="#1f8f63" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M442 470 C 452 420 422 400 442 350 C 462 300 428 280 448 230" stroke="#1f8f63" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M110 480 C 100 440 125 425 112 385" stroke="#2fae76" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M400 480 C 410 440 385 425 398 385" stroke="#2fae76" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bubbles -->
  <circle cx="110" cy="150" r="8" fill="#ffffff" opacity="0.5"/>
  <circle cx="130" cy="120" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="405" cy="140" r="7" fill="#ffffff" opacity="0.5"/>
  <circle cx="385" cy="110" r="4" fill="#ffffff" opacity="0.4"/>
  <circle cx="70" cy="260" r="6" fill="#ffffff" opacity="0.35"/>
  <circle cx="440" cy="270" r="6" fill="#ffffff" opacity="0.35"/>

  <!-- Chibi character -->
  <g transform="translate(256,268)">
    <!-- twin-tail seaweed hair back strands -->
    <path d="M-70 -30 C -110 10 -100 70 -60 100 C -80 60 -80 20 -55 -10 Z" fill="url(#hairGradDark)"/>
    <path d="M70 -30 C 110 10 100 70 60 100 C 80 60 80 20 55 -10 Z" fill="url(#hairGradDark)"/>

    <!-- body / dress -->
    <path d="M-58 40 C -58 90 -40 130 0 130 C 40 130 58 90 58 40 C 58 15 30 -5 0 -5 C -30 -5 -58 15 -58 40 Z" fill="#0b7fa8"/>
    <path d="M-58 40 C -58 90 -40 130 0 130 C 40 130 58 90 58 40" fill="none" stroke="#095e78" stroke-width="4" opacity="0.4"/>

    <!-- arms -->
    <path d="M-56 45 C -80 55 -90 75 -85 95 C -78 90 -68 78 -50 68 Z" fill="url(#skinGrad)"/>
    <path d="M56 45 C 80 55 90 75 85 95 C 78 90 68 78 50 68 Z" fill="url(#skinGrad)"/>

    <!-- head -->
    <circle cx="0" cy="-40" r="66" fill="url(#skinGrad)"/>

    <!-- hair top -->
    <path d="M-66 -40 C -70 -95 -30 -120 0 -120 C 30 -120 70 -95 66 -40 C 60 -70 40 -85 0 -85 C -40 -85 -60 -70 -66 -40 Z" fill="url(#hairGrad)"/>
    <path d="M-40 -95 C -50 -70 -46 -50 -55 -35" stroke="#146a4a" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M40 -95 C 50 -70 46 -50 55 -35" stroke="#146a4a" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- side hair strands framing face -->
    <path d="M-64 -35 C -72 -5 -66 25 -50 40 C -62 10 -60 -15 -50 -35 Z" fill="url(#hairGrad)"/>
    <path d="M64 -35 C 72 -5 66 25 50 40 C 62 10 60 -15 50 -35 Z" fill="url(#hairGrad)"/>

    <!-- seaweed leaf hair accessory -->
    <path d="M-6 -112 C -20 -140 -4 -160 14 -158 C 8 -140 6 -122 6 -108 Z" fill="#2fae76"/>

    <!-- blush -->
    <ellipse cx="-30" cy="-25" rx="9" ry="6" fill="#ff9e9e" opacity="0.6"/>
    <ellipse cx="30" cy="-25" rx="9" ry="6" fill="#ff9e9e" opacity="0.6"/>

    <!-- eyes -->
    <g>
      <ellipse cx="-22" cy="-38" rx="10" ry="13" fill="#0d3b4a"/>
      <ellipse cx="-19" cy="-42" rx="3.5" ry="4.5" fill="#ffffff"/>
      <ellipse cx="22" cy="-38" rx="10" ry="13" fill="#0d3b4a"/>
      <ellipse cx="25" cy="-42" rx="3.5" ry="4.5" fill="#ffffff"/>
    </g>

    <!-- mouth -->
    <path d="M-6 -12 Q 0 -6 6 -12" stroke="#a8523f" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- folder/file she's holding -->
    <g transform="translate(0,58) rotate(-8)">
      <path d="M-34 -18 L -10 -18 L -4 -10 L 34 -10 L 34 20 L -34 20 Z" fill="url(#folderGrad)" stroke="#a8232b" stroke-width="2"/>
      <text x="0" y="10" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">FS</text>
    </g>
  </g>

  <!-- Title text -->
  <text x="256" y="470" font-family="Verdana, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.95">nestjs-seaweedfs</text>
</svg>
